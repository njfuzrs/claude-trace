name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    # 本项目是 macOS-only（launchd / fswatch），但纯 Python 的数据处理部分在
    # Linux 上也能跑，所以 ubuntu 一起跑 lint + 单测，不测 launchd 链路。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        # 下限必须与 pyproject.toml 的 requires-python 一致：
        # trace_agent.py 用了 PEP 604 的 `X | None`，3.9 下会直接 TypeError。
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: ruff（correctness 档）
        run: ruff check .

      - name: 语法自检：所有入库脚本在本版本下可导入
        # 这一步专门兜住「声明支持 3.10 但代码里有更高版本语法」这类问题：
        # ruff 是静态检查，compileall 才会真正按当前解释器编译。
        run: python -m compileall -q $(git ls-files '*.py')

      - name: shell 语法检查
        run: for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done

      - name: pytest
        run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  privacy-defaults:
    # 隐私默认值门禁：这三条是 SECURITY.md 承诺的边界，回归了必须让 CI 红。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 身份字段不得回退到真实用户名/主机名
        run: |
          if grep -nE 'os\.getlogin\(\)|os\.uname\(\)|platform\.node\(\)|\$\(whoami\)' \
               uploader.py dist/install.sh; then
            echo "::error::身份字段出现真实身份回退，见 SECURITY.md 的隐私边界"
            exit 1
          fi

      - name: 上传端点与凭据不得有内置默认值
        run: |
          if grep -nE 'TRAJ_(PLATFORM_URL|UPLOAD_TOKEN)="\$\{TRAJ_[A-Z_]+:-[^}]+\}"' \
               dist/install.sh; then
            echo "::error::上传端点/凭据出现内置默认值，上传必须保持 opt-in"
            exit 1
          fi

      - name: 代理不得默认绑定 0.0.0.0
        run: |
          if grep -nE '"0\.0\.0\.0"|'"'"'0\.0\.0\.0'"'" proxy.py; then
            echo "::error::代理默认监听地址不得为 0.0.0.0"
            exit 1
          fi

      - name: 版本号两处必须一致
        # version 文件是单一事实源，pyproject.toml 另写了一份。
        # 人肉同步注定会漏；漏掉的后果不是报错，而是发出去的包与包元数据对不上。
        run: |
          FILE_VER=$(tr -d '[:space:]' < version)
          if ! grep -E "^version = \"${FILE_VER}\"" pyproject.toml; then
            echo "::error::version 文件是 ${FILE_VER}，pyproject.toml 对不上。用 ./build/release.sh --bump 一次改全。"
            grep -n '^version' pyproject.toml || true
            exit 1
          fi

      - name: 安装器候选名含带版本的 tarball
        # 曾经 basename 拿到 v0.x.x，正则要求以数字开头，带版本号的候选名被跳过，
        # 发了 Release 用户也 404。这条门禁不真装，只跑 --print-plan。
        run: |
          out=$(VERSION=0.3.0 ARCH=arm64 RELEASE_BASE=https://example.invalid/download/v0.3.0 \
                bash dist/install.sh --print-plan)
          echo "$out"
          echo "$out" | grep -qxF "candidate=claude-trace-0.3.0-darwin-arm64.tar.gz"
          echo "$out" | grep -qxF "install_mode=remote"
