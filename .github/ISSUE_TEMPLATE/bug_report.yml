name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **不要在这里贴轨迹文件或日志原文。** 轨迹含完整对话内容，
        日志可能含 token。贴之前先自查，或只贴脱敏后的片段。
        安全漏洞请走 [私密上报通道](https://github.com/njfuzrs/claude-trace/security/advisories/new)，不要开 issue。

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么，期望是什么
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 ...
        2. 观察 ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 仓库根目录 version 文件的内容，或 commit hash
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: macOS 版本
      placeholder: "如 15.0 / Darwin 25.6.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      description: "python3 --version（本项目要求 >= 3.10）"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志（脱敏后）
      description: "/tmp/claude-trace-proxy.log 的相关片段，请先删掉 token 与对话内容"
      render: text
